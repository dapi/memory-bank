version: 1
process: feature
stages:
  bootstrap_brief:
    - memory-bank/flows/behavior-specification.md
    - memory-bank/flows/feature-artifact-catalog.md
    - memory-bank/features/README.md
    - memory-bank/prd/*.md
    - memory-bank/product/*.md
    - memory-bank/domain/*.md
    - memory-bank/engineering/autonomy-boundaries.md
    - memory-bank/engineering/validation-profiles.md
    - memory-bank/flows/templates/feature/README.md
    - memory-bank/flows/templates/feature/brief.md
  design:
    - memory-bank/adr/*.md
    - memory-bank/engineering/README.md
    - memory-bank/engineering/architecture.md
    - memory-bank/flows/templates/feature/design.md
  ui_design:
    - memory-bank/engineering/frontend.md
    - memory-bank/engineering/ui-design-guide/README.md
    - memory-bank/engineering/ui-design-guide/admin.md
    - memory-bank/engineering/ui-design-guide/mobile.md
    - memory-bank/engineering/ui-design-guide/public-web.md
    - memory-bank/engineering/ui-design-guide/shared-components.md
    - memory-bank/flows/templates/feature/support/ui-reference.md
  interaction_runtime_design:
    - memory-bank/flows/templates/feature/api-contract.md
    - memory-bank/flows/templates/feature/support/runtime-surfaces.md
    - memory-bank/flows/templates/feature/support/sequence-diagram.md
  scenario_design:
    - memory-bank/flows/behavior-specification.md
    - memory-bank/flows/templates/feature/support/use-cases.md
  plan_ready:
    - memory-bank/flows/templates/feature/implementation-plan.md
    - memory-bank/engineering/testing-policy.md
    - memory-bank/engineering/coding-style.md
    - memory-bank/ops/development.md
    - memory-bank/ops/config.md
  execution_continuation:
    - memory-bank/features/<FT-ID>/*.md
    - memory-bank/engineering/git-workflow.md
  execution_handoff:
    - memory-bank/flows/execution-handoff.md
