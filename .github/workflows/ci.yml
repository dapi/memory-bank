name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    env:
      MEMORY_BANK_CLI_VERSION: v2.3.0
      MEMORY_BANK_CLI_SHA256: d2985dbe60f2beb9af9ad23825fd98b90e5112bfbf6f1aacc76e4531990c6653
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install memory-bank-cli
        run: |
          asset="memory-bank-cli-linux-amd64"
          url="https://github.com/dapi/memory-bank-cli/releases/download/${MEMORY_BANK_CLI_VERSION}/${asset}"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/$asset"
          echo "${MEMORY_BANK_CLI_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check
          chmod +x "$RUNNER_TEMP/$asset"
          mkdir -p "$RUNNER_TEMP/memory-bank-cli-bin"
          mv "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/memory-bank-cli-bin/memory-bank-cli"
          echo "$RUNNER_TEMP/memory-bank-cli-bin" >> "$GITHUB_PATH"

      - name: Check CLI version
        run: memory-bank-cli --version

      - name: Check dual-role repository layout
        run: |
          test -d template/memory-bank
          test -d memory-bank

      - name: Validate priming manifests
        run: |
          ruby tools/validate-priming-manifests-test.rb
          ruby tools/validate-priming-manifests.rb template/memory-bank

      - name: Lint template
        run: memory-bank-cli lint --scope-root template/memory-bank --entrypoint template/memory-bank/README.md

      - name: Lint project-local Memory Bank
        run: memory-bank-cli lint --repo-root .

      - name: Diagnose template
        run: memory-bank-cli doctor --profile template

      - name: Smoke-test downstream init
        run: |
          source="$RUNNER_TEMP/template-source"
          downstream="$RUNNER_TEMP/downstream"
          mkdir -p "$source/template" "$downstream"
          cp -R "$GITHUB_WORKSPACE/template/memory-bank" "$source/template/memory-bank"
          git -C "$source" init --quiet
          git -C "$source" config user.name "CI"
          git -C "$source" config user.email "ci@example.invalid"
          git -C "$source" add template/memory-bank
          git -C "$source" commit --quiet -m "ci source payload"
          git -C "$downstream" init
          memory-bank-cli init \
            --repo-root "$downstream" \
            --source "$source" \
            --template-version ci \
            --source-ref "$(git -C "$source" rev-parse HEAD)"
          test -d "$downstream/memory-bank"
          test ! -e "$downstream/template/memory-bank"
          memory-bank-cli lint --repo-root "$downstream"
