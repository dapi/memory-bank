name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Run tests
        run: go test -count=1 -race ./...

      - name: Run vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Code is not formatted:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Build and run validator
        env:
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w -X main.version=ci" -o "$RUNNER_TEMP/memory-bank-lint" ./cmd/memory-bank-lint
          "$RUNNER_TEMP/memory-bank-lint" --version
          "$RUNNER_TEMP/memory-bank-lint"

  release-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
