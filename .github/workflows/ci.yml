name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-template:
    runs-on: ubuntu-latest
    env:
      MEMORY_BANK_CLI_VERSION: v1.0.0
      MEMORY_BANK_CLI_SHA256: 35300dd2f713e904a5819a31b064e12809b93921a557fbfb3f2543c45c733c57
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install memory-bank-cli
        run: |
          asset="memory-bank-cli-linux-amd64"
          url="https://github.com/dapi/memory-bank-cli/releases/download/${MEMORY_BANK_CLI_VERSION}/${asset}"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/$asset"
          echo "${MEMORY_BANK_CLI_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check
          chmod +x "$RUNNER_TEMP/$asset"
          mkdir -p "$RUNNER_TEMP/memory-bank-cli-bin"
          mv "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/memory-bank-cli-bin/memory-bank-cli"
          echo "$RUNNER_TEMP/memory-bank-cli-bin" >> "$GITHUB_PATH"

      - name: Check CLI version
        run: memory-bank-cli --version

      - name: Check source payload layout
        run: |
          test -d memory-bank-template
          test ! -e memory-bank

      - name: Lint template
        run: memory-bank-cli lint

      - name: Diagnose template
        run: memory-bank-cli doctor --profile template

      - name: Smoke-test downstream init
        run: |
          downstream="$RUNNER_TEMP/downstream"
          mkdir "$downstream"
          git -C "$downstream" init
          memory-bank-cli init \
            --repo-root "$downstream" \
            --source "$GITHUB_WORKSPACE" \
            --template-version ci \
            --source-ref "$(git rev-parse HEAD)"
          test -d "$downstream/memory-bank"
          test ! -e "$downstream/memory-bank-template"
          memory-bank-cli lint --repo-root "$downstream"
